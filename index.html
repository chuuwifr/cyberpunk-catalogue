    <script>
      // Gracefully prevent transient WebSocket / HMR connection warnings in preview iframes
      window.addEventListener('unhandledrejection', function(e) {
        var msg = String(e.reason && (e.reason.message || e.reason) || '');
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        var src = String(e.filename || '');
        var msg = String(e.message || '');
        if (src.includes('@vite/client') || msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport')) {
          e.preventDefault();
        }
      });
    </script>
